name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx biome check .
      - run: bunx tsc -p tsconfig.json
      - name: Unit and adapter tests
        run: bun test packages
      - name: Headless end-to-end lifecycle
        run: bun test tests/e2e
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm package installs and runs on the minimum Node version
        run: bun run build:npm && bun run test:npm
